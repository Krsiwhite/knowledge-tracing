name: knowledge_tracing
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.11
  - pytest
  - numpy=1.26.4
  - scipy
  - matplotlib
  - pandas
  - scikit-learn
  - jupyterlab
  - tensorboard
  - pytorch=2.2
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - pip
  - pip:
      - SQLAlchemy==1.4.46 # due to optuna storage
      - fire
      - hydra-core
      - hydra-ray-launcher
      - hydra-optuna-sweeper==1.3.0.dev0
      - -e pykt-toolkit
      - tqdm
      - einops
      - tabulate
      - -e pkg
      - plotly
