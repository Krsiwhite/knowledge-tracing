[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktlab-research"
version = "0.1.0"
description = "Reproducible knowledge tracing research on a pinned pyKT foundation"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "torch", "PyYAML"]

[project.scripts]
kt = "ktlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
